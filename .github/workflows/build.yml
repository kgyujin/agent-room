name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - name: Linux deps for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: cargo test -p agent-room-core
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Build hook sidecar + app crate
        working-directory: app
        run: |
          node scripts/build-hook.mjs
          mkdir -p dist
          cargo build -p agent-room-app

  # the screens in a real browser (preview data): page errors, a dashboard that needs scrolling
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run build && npm run ui-check
        working-directory: app

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # reuse compiled Rust deps between runs (main's cache is readable from release tags)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build .app / .dmg (unsigned; update signing only happens in the release workflow)
        working-directory: app
        run: |
          node scripts/build-hook.mjs --release
          npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify ad-hoc signature
        run: codesign --verify --deep --strict --verbose=2 "target/release/bundle/macos/Agent Room.app"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-room-macos-arm64
          # dmg only: zipped artifacts drop the executable bit inside a raw .app
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
