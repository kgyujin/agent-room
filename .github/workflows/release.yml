name: release

# Every push to main publishes a GitHub Release with the .dmg plus the signed update bundle
# and latest.json that the app's built-in updater reads. The version is major.minor from
# app/src-tauri/tauri.conf.json and the run number as the patch (0.3.0 -> 0.3.<run>), so each
# release is newer than the last without a version-bump commit.
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # reuse compiled Rust deps between runs (main's cache is readable from release tags)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Set the release version
        id: ver
        working-directory: app
        run: |
          node -e '
            const f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(require("fs").readFileSync(f, "utf8"));
            const [major, minor] = c.version.split(".");
            c.version = `${major}.${minor}.${process.env.RUN}`;
            require("fs").writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${c.version}\n`);
          '
        env:
          RUN: ${{ github.run_number }}
      - name: Build hook sidecar
        working-directory: app
        run: node scripts/build-hook.mjs --release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: Agent Room ${{ steps.ver.outputs.tag }}
          releaseBody: 'macOS(Apple Silicon)용 .dmg 를 받거나, 이미 설치된 앱에서 업데이트를 누르세요.'
          releaseDraft: false
          includeUpdaterJson: true
